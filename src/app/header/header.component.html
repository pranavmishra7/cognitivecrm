<!-- Header -->
<header *ngIf="isLoggedIn" class="bg-blue-600 text-white px-6 py-4 relative flex items-center justify-between z-50">

  <!-- Left: Hamburger + Logo -->
  <div class="flex items-center gap-3">
    <button (click)="toggleMenu()" aria-label="Toggle menu" class="z-50 relative">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2"
           viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <label class="font-medium hidden sm:inline">Welcome, {{ userName }}</label>
    <img src="assets/logo.png" alt="Logo" class="h-8 w-8" />
  </div>

  <!-- Center: Title -->
  <div class="absolute left-0 right-0 flex justify-center pointer-events-none">
    <div class="text-xl font-semibold pointer-events-auto">CRM Portal</div>
  </div>

  <!-- Right: Logout Button -->
  <button (click)="logout()"
          aria-label="Logout"
          class="flex items-center gap-2 px-3 py-2 rounded-lg bg-red-500 text-white hover:bg-red-600 transition shadow z-50 relative">

    <!-- Logout Icon -->
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
         viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6A2.25 2.25 0 005.25 5.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M18 12h-9m0 0l3-3m-3 3l3 3" />
    </svg>

    <span class="font-medium hidden sm:inline">Logout</span>
  </button>
</header>

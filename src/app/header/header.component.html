<!-- Header -->
<header *ngIf="isLoggedIn" class="bg-blue-600 text-white px-6 py-4 relative flex items-center justify-between z-50">

  <!-- Left: Hamburger + Logo -->
  <div class="flex items-center gap-3">
    <button (click)="toggleMenu()" aria-label="Toggle menu" class="z-50 relative">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <label class="font-medium hidden sm:inline">Welcome, {{ userName }}</label>
    <img src="assets/logo.png" alt="Logo" class="h-8 w-8" />
  </div>

  <!-- Center: Title -->
  <div class="absolute left-0 right-0 flex justify-center pointer-events-none">
    <div class="text-xl font-semibold pointer-events-auto">CRM Portal</div>
  </div>

  <!-- Right: Logout -->
  <button (click)="logout()" class="flex items-center gap-2 px-3 py-2 rounded-lg bg-red-500 hover:bg-red-600 z-50">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6A2.25 2.25 0 005.25 5.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M18 12h-9m0 0l3-3m-3 3l3 3" />
    </svg>
    <span class="hidden sm:inline font-medium">Logout</span>
  </button>
</header>

<!-- Sidebar Navigation -->
<nav [ngClass]="{ 'translate-x-0': menuOpen, '-translate-x-full': !menuOpen }"
  class="fixed top-0 left-0 h-full w-64 bg-blue-700 text-white transition-transform duration-300 z-40 overflow-y-auto pt-20 px-6">

  <div class="flex flex-col space-y-4">

    <!-- Static Link -->
    <a routerLink="/form-builder" (click)="menuOpen = false" class="hover:underline font-semibold">
      Form Builder
    </a>

    <!-- 🔹 GROUPED DYNAMIC MENU -->
    <div *ngFor="let module of groupedMenu" class="mt-2">

      <!-- Module -->
      <div class="cursor-pointer font-semibold flex items-center justify-between py-2 px-2 rounded hover:bg-blue-600"
        (click)="module.open = !module.open">
        <span>{{ module.name }}</span>
        <svg class="w-4 h-4 transform transition-transform" [ngClass]="{ 'rotate-180': module.open }" fill="none"
          stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
        </svg>
      </div>

      <!-- Forms / Reports -->
      <div *ngIf="module.open" class="ml-3 mt-1 space-y-1">

        <div *ngFor="let group of module.children">

          <div
            class="cursor-pointer text-sm font-medium flex items-center justify-between px-2 py-1 hover:bg-blue-600 rounded"
            (click)="group.open = !group.open">
            <span>{{ group.name }}</span>
            <svg class="sica w-3 h-3 transform transition-transform" [ngClass]="{ 'rotate-180': group.open }"
              fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>

          <!-- Links -->
          <div *ngIf="group.open" class="ml-3">
            <a *ngFor="let item of group.items" [routerLink]="item.route" routerLinkActive="font-bold text-yellow-300"
              (click)="menuOpen = false" class="block px-2 py-1 rounded hover:bg-blue-600">
              {{ item.label }}
            </a>
          </div>

        </div>
      </div>
    </div>

    <!-- Admin / Settings (UNCHANGED) -->
    <div class="mt-4">
      <div class="cursor-pointer hover:underline flex items-center justify-between"
        (click)="settingsExpanded = !settingsExpanded">
        <span>Settings</span>
        <svg class="w-4 h-4 transform transition-transform" [ngClass]="{ 'rotate-180': settingsExpanded }" fill="none"
          stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
        </svg>
      </div>

      <div *ngIf="settingsExpanded" class="ml-4 mt-2 flex flex-col space-y-1">
        <a routerLink="/product" (click)="menuOpen = false" class="hover:underline">
          Product
        </a>
      </div>
    </div>

  </div>
</nav>

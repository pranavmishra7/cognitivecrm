<div class="p-4">
  <div class="flex justify-between mb-4">
    <h2 class="text-xl font-bold">Workflow Templates</h2>
    <button class="btn btn-primary" (click)="create()">New Template</button>
  </div>

  <table class="w-full border">
    <thead>
      <tr class="bg-gray-100">
        <th class="p-2 border">Name</th>
        <th class="p-2 border">Version</th>
        <th class="p-2 border">Active</th>
        <th class="p-2 border">Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of templates">
        <td class="p-2 border">{{ t.name }}</td>
        <td class="p-2 border">{{ t.version }}</td>
        <td class="p-2 border">{{ t.isActive }}</td>
        <td class="p-2 border">
          <button class="btn btn-sm" (click)="edit(t.id)">Edit</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="flex justify-center items-center h-screen bg-gradient-to-r from-blue-50 to-blue-100">
  <div class="bg-white shadow-xl rounded-lg p-8 w-96">
    <!-- Logo / Title -->
    <div class="flex justify-center mb-6">
      <img src="assets/logo.png" alt="App Logo" class="h-12 w-12 mr-2" />
      <h2 class="text-2xl font-bold text-blue-700">Welcome Back</h2>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Username -->
      <div>
        <label class="block text-sm font-medium mb-1">Username</label>
        <input formControlName="userName"
               type="text"
               placeholder="Enter username"
               class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-400 outline-none" />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input formControlName="password"
               type="password"
               placeholder="Enter password"
               class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-400 outline-none" />
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="text-red-500 text-sm text-center">
        {{ errorMessage }}
      </div>

      <!-- Login Button -->
      <button type="submit"
              class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
        Login
      </button>
    </form>

    <!-- Register Link -->
    <div class="mt-6 text-center">
      <span class="text-gray-600 text-sm">Don’t have an account?</span>
      <a routerLink="/register"
         class="ml-1 text-blue-600 font-semibold hover:underline">
        Register here
      </a>
    </div>
  </div>
</div>

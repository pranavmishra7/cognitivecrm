<!-- tabs -->
<div class="p-6">
  <div class="flex items-center space-x-4 mb-4">
    <button (click)="selectTab('list')" [ngClass]="{ 'border-b-2 border-blue-600 text-blue-600': activeTab === 'list' }"
      [attr.aria-pressed]="activeTab === 'list'" class="px-4 py-2 font-medium">
      List
    </button>

    <button (click)="selectTab('create')"
      [ngClass]="{ 'border-b-2 border-blue-600 text-blue-600': activeTab === 'create' }"
      [attr.aria-pressed]="activeTab === 'create'" class="px-4 py-2 font-medium">
      Create
    </button>

  </div>

  <!-- TAB PANELS -->
  <div class="bg-white rounded-lg shadow p-4">
    <!-- LIST TAB -->
    <div *ngIf="activeTab === 'list'">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold">Form Data Values</h3>

        <div class="flex items-center space-x-2">
          <input type="text" placeholder="Search..." [(ngModel)]="listFilter" (ngModelChange)="applyFilter()"
            class="border rounded px-3 py-1" />
          <button (click)="reload()" class="bg-blue-600 text-white px-3 py-1 rounded">Reload</button>
        </div>
      </div>

      <div *ngIf="isLoading" class="text-center py-6">Loading...</div>

      <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 600px;" [rowData]="rowData"
        [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="pageSize" [rowSelection]="'multiple'"
        [defaultColDef]="{
                          filter: true,
                          sortable: true,
                          resizable: true
                          }">
      </ag-grid-angular>
      
      <div *ngIf="!isLoading && (!items || items.length === 0)" class="text-center py-6 text-gray-600">
        No records found.
      </div>

      <!-- simple paging controls -->
      <div class="flex justify-between items-center mt-4">
        <div>
          Page {{ pageNumber }} of {{ totalPages }} — {{ totalCount }} total
        </div>
        <div class="space-x-2">
          <button (click)="prevPage()" [disabled]="pageNumber <= 1" class="px-3 py-1 border rounded">Prev</button>
          <button (click)="nextPage()" [disabled]="pageNumber >= totalPages"
            class="px-3 py-1 border rounded">Next</button>
        </div>
      </div>
    </div>

    <!-- CREATE TAB (your original form moved here) -->
    <div *ngIf="activeTab === 'create'">
      <div *ngIf="formConfig" class="space-y-6 p-6 pb-32">
        <h2 class="text-2xl font-bold mb-4">{{ formConfig.formName! }}</h2>
        <!-- Top action bar: Template (left) + Import (right) -->
        <div class="w-full bg-white shadow-lg border-t p-4 flex justify-between items-center">
          <!-- LEFT: Download Template -->
          <button type="button" (click)="downloadTemplate()" class="bg-yellow-500 text-white px-4 py-2 rounded shadow">
            Download Bulk Import Template
          </button>

          <!-- RIGHT: Import -->
          <div>
            <input #fileInput type="file" accept=".csv,.xlsx" hidden
              (change)="onTemplateFileChange($any($event.target).files?.[0])" />
            <button type="button" class="bg-blue-600 text-white px-4 py-2 rounded shadow" (click)="fileInput.click()">
              📁 Import CSV / Excel
            </button>
          </div>
        </div>

        <!-- Sections -->
        <div *ngFor="let section of formConfig.sections" class="bg-white rounded-lg shadow p-6">
          <h3 class="text-xl font-semibold mb-4">{{ formatLabel(section.sectionName) }}</h3>

          <form [formGroup]="sectionForms[section.id!]" class="grid grid-cols-2 gap-4">
            <div *ngFor="let field of section?.fields" class="flex flex-col space-y-1">
              <label class="font-medium">{{ field?.label }}</label>

              <!-- Text / Number / Date -->
              <input *ngIf="['text','number','date','email','numeric','decimal']
                  .includes(normalizeType(field.type!))" [type]="normalizeType(field.type!) === 'numeric' ? 'number' :
                        normalizeType(field.type!) === 'decimal' ? 'number' :
                        normalizeType(field.type!)" [formControlName]="field?.fieldName ?? ''"
                [placeholder]="field?.placeholder" class="border rounded px-3 py-2 focus:ring focus:ring-blue-200" />

              <input *ngIf="normalizeType(field.type!).startsWith('autogenerated')" type="text"
                [formControlName]="field?.fieldName ?? ''" readonly
                class="border rounded px-3 py-2 bg-gray-100 cursor-not-allowed" />

              <!-- Dropdown -->
              <select *ngIf="normalizeType(field.type!) === 'dropdown'" [formControlName]="field.fieldName"
                class="border rounded px-3 py-2 focus:ring focus:ring-blue-200">
                <option value="">Select {{ field.label }}</option>
                <option *ngFor="let opt of field.options?.split(',')" [value]="opt.trim()">
                  {{ opt }}
                </option>
              </select>

              <select *ngIf="normalizeType(field.type!) === 'multiselect'" multiple [formControlName]="field.fieldName"
                class="border rounded px-3 py-2 h-28 focus:ring focus:ring-blue-200">
                <option *ngFor="let opt of field.options?.split(',')" [value]="opt.trim()">
                  {{ opt.trim() }}
                </option>
              </select>

              <!-- Autocomplete -->
              <input *ngIf="normalizeType(field.type!) === 'autocomplete'" [attr.list]="field.fieldName  + '_list'"
                [formControlName]="field.fieldName" [placeholder]="field.placeholder"
                (input)="onAutocompleteInput(field, $any($event.target).value)"
                (change)="onAutocompleteSelect(field, $any($event.target).value)"
                class="border rounded px-3 py-2 focus:ring focus:ring-blue-200" />

              <datalist [id]="field.fieldName + '_list'">
                <option *ngFor="let opt of field.optionList" [value]="opt ? opt : ''"></option>
              </datalist>

              <!-- Checkbox toggle -->
              <div *ngIf="normalizeType(field.type!) === 'checkbox'"
                class="flex items-center space-x-3 cursor-pointer select-none"
                (click)="toggleCheckbox(section.id!, field.fieldName)">
                <div [ngClass]="{
                    'bg-green-500': getFieldControl(section.id!, field.fieldName)?.value,
                    'bg-gray-300': !getFieldControl(section.id!, field.fieldName)?.value
                  }" class="relative w-12 h-6 rounded-full transition-colors duration-300">
                  <div [ngClass]="{
                      'translate-x-6': getFieldControl(section.id!, field.fieldName)?.value,
                      'translate-x-0': !getFieldControl(section.id!, field.fieldName)?.value
                    }"
                    class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform duration-300">
                  </div>
                </div>
                <span class="text-gray-800 font-medium">{{ field.label }}</span>
              </div>

              <!-- Validation -->
              <div class="text-red-600 text-sm mt-1"
                *ngIf="submitted && getFieldControl(section.id!, field.fieldName)?.invalid">
                {{ field.validationMessage || (field.label + ' is required') }}
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Sticky Footer Buttons (same as before) -->
      <div class="fixed bottom-0 left-0 right-0 bg-white shadow-lg border-t p-4 flex justify-end space-x-4">
        <button type="button" (click)="onSaveDraft()" class="bg-yellow-500 text-white px-4 py-2 rounded shadow">Save
          Draft</button>
        <button type="button" (click)="onSubmit()"
          class="bg-blue-600 text-white px-4 py-2 rounded shadow">Submit</button>
        <button type="button" (click)="onReset()" class="bg-gray-500 text-white px-4 py-2 rounded shadow">Reset</button>
      </div>
    </div>
  </div>
</div>

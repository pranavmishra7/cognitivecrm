<form #f="ngForm" (ngSubmit)="onSubmit(f)" class="other-amount-details-form">
  <div class="form-row">
    <label for="orcCommAmt">ORC Comm Amt</label>
    <input id="orcCommAmt" name="orcCommAmt" [(ngModel)]="model.OrcCommAmt" type="text" />
  </div>
  <div class="form-row">
    <label for="tdsAmt">TDS Amt</label>
    <input id="tdsAmt" name="tdsAmt" [(ngModel)]="model.TdsAmt" type="text" />
  </div>
  <div class="form-row">
    <label for="amountClaimed">Amount Claimed</label>
    <input id="amountClaimed" name="amountClaimed" [(ngModel)]="model.AmountClaimed" type="number" />
  </div>
  <div class="form-row">
    <label for="amountReceived">Amount Received</label>
    <input id="amountReceived" name="amountReceived" [(ngModel)]="model.AmountReceived" type="number" />
  </div>
  <div class="form-row">
    <label for="orcPending">ORC Pending</label>
    <input id="orcPending" name="orcPending" [(ngModel)]="model.OrcPending" type="text" />
  </div>
  <div class="actions">
    <button type="button" (click)="emitChange()">Apply</button>
    <button type="submit">Save</button>
  </div>
</form>

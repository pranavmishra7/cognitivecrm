<form #f="ngForm" (ngSubmit)="onSubmit(f)" class="plan-and-premium-details-form">
  <div class="form-row">
    <label for="planName">Plan Name</label>
    <input id="planName" name="planName" [(ngModel)]="model.PlanName" type="text" />
  </div>
  <div class="form-row">
    <label for="pt">PT</label>
    <input id="pt" name="pt" [(ngModel)]="model.Pt" type="text" />
  </div>
  <div class="form-row">
    <label for="ppt">PPT</label>
    <input id="ppt" name="ppt" [(ngModel)]="model.Ppt" type="text" />
  </div>
  <div class="form-row">
    <label for="sumAssured">Sum Assured</label>
    <input id="sumAssured" name="sumAssured" [(ngModel)]="model.SumAssured" type="number" />
  </div>
  <div class="form-row">
    <label for="mode">Mode</label>
    <input id="mode" name="mode" [(ngModel)]="model.Mode" type="text" />
  </div>
  <div class="form-row">
    <label for="chequeAmount">Cheque Amount</label>
    <input id="chequeAmount" name="chequeAmount" [(ngModel)]="model.ChequeAmount" type="number" />
  </div>
  <div class="form-row">
    <label for="modelPremium">Model Premium</label>
    <input id="modelPremium" name="modelPremium" [(ngModel)]="model.ModelPremium" type="number" />
  </div>
  <div class="form-row">
    <label for="wrp">WRP</label>
    <input id="wrp" name="wrp" [(ngModel)]="model.Wrp" type="text" />
  </div>
  <div class="form-row">
    <label for="wapi">WAPI</label>
    <input id="wapi" name="wapi" [(ngModel)]="model.Wapi" type="text" />
  </div>
  <div class="actions">
    <button type="button" (click)="emitChange()">Apply</button>
    <button type="submit">Save</button>
  </div>
</form>

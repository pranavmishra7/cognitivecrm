<form #f="ngForm" (ngSubmit)="onSubmit(f)" class="total-details-form">
  <div class="form-row">
    <label for="totalReceivable">Total Receivable</label>
    <input id="totalReceivable" name="totalReceivable" [(ngModel)]="model.TotalReceivable" type="date" />
  </div>
  <div class="form-row">
    <label for="totalRecevied">Total Recevied</label>
    <input id="totalRecevied" name="totalRecevied" [(ngModel)]="model.TotalRecevied" type="date" />
  </div>
  <div class="form-row">
    <label for="pendingTotal">Pending Total</label>
    <input id="pendingTotal" name="pendingTotal" [(ngModel)]="model.PendingTotal" type="date" />
  </div>
  <div class="actions">
    <button type="button" (click)="emitChange()">Apply</button>
    <button type="submit">Save</button>
  </div>
</form>

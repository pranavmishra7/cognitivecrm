<form #f="ngForm" (ngSubmit)="onSubmit(f)" class="final-details-form">
  <div class="form-row">
    <label for="apartBcOrcComm">Apart BC & ORC Comm</label>
    <input id="apartBcOrcComm" name="apartBcOrcComm" [(ngModel)]="model.ApartBcOrcComm" type="text" />
  </div>
  <div class="form-row">
    <label for="totalPending">Total Pending</label>
    <input id="totalPending" name="totalPending" [(ngModel)]="model.TotalPending" type="date" />
  </div>
  <div class="actions">
    <button type="button" (click)="emitChange()">Apply</button>
    <button type="submit">Save</button>
  </div>
</form>

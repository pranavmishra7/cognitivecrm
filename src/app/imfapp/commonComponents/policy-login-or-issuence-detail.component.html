<form #f="ngForm" (ngSubmit)="onSubmit(f)" class="policy-login-or-issuence-detail-form">
  <div class="form-row">
    <label for="principalCoLoginDt">Principal Co Login Dt</label>
    <input id="principalCoLoginDt" name="principalCoLoginDt" [(ngModel)]="model.PrincipalCoLoginDt" type="text" />
  </div>
  <div class="form-row">
    <label for="policyNumber">Policy Number</label>
    <input id="policyNumber" name="policyNumber" [(ngModel)]="model.PolicyNumber" type="text" />
  </div>
  <div class="form-row">
    <label for="issueDate">Issue Date</label>
    <input id="issueDate" name="issueDate" [(ngModel)]="model.IssueDate" type="date" />
  </div>
  <div class="form-row">
    <label for="policyStatus">Policy Status</label>
    <input id="policyStatus" name="policyStatus" [(ngModel)]="model.PolicyStatus" type="text" />
  </div>
  <div class="form-row">
    <label for="workFlowStatus">Work Flow Status</label>
    <input id="workFlowStatus" name="workFlowStatus" [(ngModel)]="model.WorkFlowStatus" type="text" />
  </div>
  <div class="form-row">
    <label for="plvcStatus">PLVC Status</label>
    <input id="plvcStatus" name="plvcStatus" [(ngModel)]="model.PlvcStatus" type="text" />
  </div>
  <div class="form-row">
    <label for="paidToDate">Paid To Date</label>
    <input id="paidToDate" name="paidToDate" [(ngModel)]="model.PaidToDate" type="date" />
  </div>
  <div class="actions">
    <button type="button" (click)="emitChange()">Apply</button>
    <button type="submit">Save</button>
  </div>
</form>

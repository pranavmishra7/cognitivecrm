<form #f="ngForm" (ngSubmit)="onSubmit(f)" class="gst-details-form">
  <div class="form-row">
    <label for="gst18">GST&#64; 18%</label>
    <input id="gst18" name="gst18" [(ngModel)]="model.Gst18" type="number" />
  </div>
  <div class="form-row">
    <label for="gstReceived">GST Received</label>
    <input id="gstReceived" name="gstReceived" [(ngModel)]="model.GstReceived" type="number" />
  </div>
  <div class="form-row">
    <label for="pendingGst">Pending GST</label>
    <input id="pendingGst" name="pendingGst" [(ngModel)]="model.PendingGst" type="number" />
  </div>
  <div class="actions">
    <button type="button" (click)="emitChange()">Apply</button>
    <button type="submit">Save</button>
  </div>
</form>

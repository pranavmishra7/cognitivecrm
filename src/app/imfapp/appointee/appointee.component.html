<!-- proposer-details.component.html -->
<form #f="ngForm" (ngSubmit)="onSubmit(f)" class="proposer-details-form" novalidate>
  <!-- Policy Holder / Proposer -->
  <div class="form-row">
    <label for="Appointee">Appointee <span class="req">*</span></label>
    <input
      id="Appointee"
      name="Appointee"
      [(ngModel)]="model.Appointee"
      #appointeeCtrl="ngModel"
      required
      minlength="2"
      maxlength="200"
    />
    <div class="error" *ngIf="appointeeCtrl.invalid && (appointeeCtrl.touched || appointeeCtrl.dirty)">
      <div *ngIf="appointeeCtrl.errors?.['required']">Name is required.</div>
      <div *ngIf="appointeeCtrl.errors?.['minlength']">Enter at least 2 characters.</div>
    </div>
  </div>

  <!-- Appointee DOB -->
  <div class="form-row">
    <label for="appointeeDob">Appointee DOB</label>
    <input
      id="proposerDob"
      name="appointeeDob"
      type="date"
      [(ngModel)]="model.AppointeeDob"
      #dobCtrl="ngModel"
      [max]="maxDob"
    />
  </div>

  <!-- PAN -->
  <div class="form-row">
    <label for="pan">PAN</label>
    <input
      id="pan"
      name="pan"
      [(ngModel)]="model.Pan"
      #panCtrl="ngModel"
      minlength="10"
      maxlength="10"
      pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}"
      placeholder="AAAAA0000A"
    />
    <div class="error" *ngIf="panCtrl.invalid && panCtrl.touched">
      <div *ngIf="panCtrl.errors?.['pattern']">PAN should be in format AAAAA0000A (uppercase).</div>
      <div *ngIf="panCtrl.errors?.['minlength'] || panCtrl.errors?.['maxlength']">PAN must be 10 characters.</div>
    </div>
  </div>

  <!-- AADHAR -->
  <div class="form-row">
    <label for="aadhar">AADHAR</label>
    <input
      id="aadhar"
      name="aadhar"
      [(ngModel)]="model.Aadhar"
      #aadharCtrl="ngModel"
      minlength="12"
      maxlength="12"
      pattern="[0-9]{12}"
      placeholder="123412341234"
    />
    <div class="error" *ngIf="aadharCtrl.invalid && aadharCtrl.touched">
      <div *ngIf="aadharCtrl.errors?.['pattern']">AADHAR must be 12 digits.</div>
    </div>
  </div>

  <!-- Contact Number -->
  <div class="form-row">
    <label for="contactNumber">Contact Number <span class="req">*</span></label>
    <input
      id="contactNumber"
      name="contactNumber"
      [(ngModel)]="model.ContactNumber"
      #contactCtrl="ngModel"
      required
      pattern="[0-9]{10}"
      placeholder="10 digit mobile number"
    />
    <div class="error" *ngIf="contactCtrl.invalid && contactCtrl.touched">
      <div *ngIf="contactCtrl.errors?.['required']">Contact number is required.</div>
      <div *ngIf="contactCtrl.errors?.['pattern']">Enter a valid 10-digit mobile number.</div>
    </div>
  </div>

  <!-- Email ID -->
  <div class="form-row">
    <label for="emailId">Email ID <span class="req">*</span></label>
    <input
      id="emailId"
      name="emailId"
      type="email"
      [(ngModel)]="model.EmailId"
      #emailCtrl="ngModel"
      required
      maxlength="254"
      placeholder="name@example.com"
    />
    <div class="error" *ngIf="emailCtrl.invalid && emailCtrl.touched">
      <div *ngIf="emailCtrl.errors?.['required']">Email is required.</div>
      <div *ngIf="emailCtrl.errors?.['email']">Enter a valid email address.</div>
    </div>
  </div>

  <!-- Address -->
  <div class="form-row">
    <label for="address">Address</label>
    <textarea
      id="address"
      name="address"
      rows="3"
      [(ngModel)]="model.Address"
      #addrCtrl="ngModel"
      maxlength="1000"
      placeholder="Flat / House no, Street, Landmark"
    ></textarea>
  </div>

  <!-- District (autocomplete via datalist) -->
  <div class="form-row">
    <label for="district">District</label>
    <input
      id="district"
      name="district"
      list="districtList"
      [(ngModel)]="model.District"
      #districtCtrl="ngModel"
      placeholder="Start typing district"
    />
    <datalist id="districtList">
      <option *ngFor="let d of districtOptions" [value]="d"></option>
    </datalist>
  </div>

  <!-- State (autocomplete) -->
  <div class="form-row">
    <label for="state">State</label>
    <input
      id="state"
      name="state"
      list="stateList"
      [(ngModel)]="model.State"
      #stateCtrl="ngModel"
      placeholder="Start typing state"
    />
    <datalist id="stateList">
      <option *ngFor="let s of stateOptions" [value]="s"></option>
    </datalist>
  </div>

  <!-- Country (autocomplete) -->
  <div class="form-row">
    <label for="country">Country</label>
    <input
      id="country"
      name="country"
      list="countryList"
      [(ngModel)]="model.Country"
      #countryCtrl="ngModel"
      placeholder="Country"
    />
    <datalist id="countryList">
      <option *ngFor="let c of countryOptions" [value]="c"></option>
    </datalist>
  </div>

  <!-- Pin code -->
  <div class="form-row">
    <label for="pinCode">Pin code</label>
    <input
      id="pinCode"
      name="pinCode"
      [(ngModel)]="model.PinCode"
      #pinCtrl="ngModel"
      pattern="[0-9]{6}"
      placeholder="6 digit PIN"
    />
    <div class="error" *ngIf="pinCtrl.invalid && pinCtrl.touched">
      <div *ngIf="pinCtrl.errors?.['pattern']">Enter a valid 6-digit PIN code.</div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="actions">
    <button type="button" (click)="emitChange()">Apply</button>
    <button type="submit">Save</button>
  </div>
</form>

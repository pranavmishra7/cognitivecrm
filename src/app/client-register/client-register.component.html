<div class="p-6 max-w-2xl mx-auto bg-white shadow rounded-lg">
  <h2 class="text-xl font-bold mb-4">Register Client</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="grid grid-cols-2 gap-4">
    <!-- Name -->
    <div class="col-span-2">
      <label class="block font-medium mb-1">Client Name</label>
      <input formControlName="name" type="text" class="w-full border rounded px-3 py-2" />
    </div>

    <!-- Description -->
    <div class="col-span-2">
      <label class="block font-medium mb-1">Description</label>
      <textarea formControlName="description" class="w-full border rounded px-3 py-2"></textarea>
    </div>

    <!-- Logo Upload -->
    <!-- <div class="col-span-2">
      <label class="block font-medium mb-1">Logo</label>
      <input type="file" (change)="onLogoUpload($event)" accept="image/*" />
      <div *ngIf="logoPreview" class="mt-2">
        <img [src]="logoPreview" alt="Logo Preview" class="h-16 border rounded" />
      </div>
    </div> -->

    <!-- UserName -->
    <div>
      <label class="block font-medium mb-1">User Name</label>
      <input formControlName="userName" type="text" class="w-full border rounded px-3 py-2" />
    </div>

    <!-- Password -->
    <div>
      <label class="block font-medium mb-1">Password</label>
      <input formControlName="userPassword" type="password" class="w-full border rounded px-3 py-2" />
    </div>

    <!-- Email -->
    <div>
      <label class="block font-medium mb-1">Email</label>
      <input formControlName="email" type="email" class="w-full border rounded px-3 py-2" />
    </div>

    <!-- Phone -->
    <div>
      <label class="block font-medium mb-1">Phone</label>
      <input formControlName="phone" type="text" class="w-full border rounded px-3 py-2" />
    </div>

    <!-- Address -->
    <div class="col-span-2">
      <label class="block font-medium mb-1">Address</label>
      <input formControlName="address" type="text" class="w-full border rounded px-3 py-2" />
    </div>

    <!-- City -->
    <div>
      <label class="block font-medium mb-1">City</label>
      <input formControlName="city" type="text" class="w-full border rounded px-3 py-2" />
    </div>

    <!-- State -->
    <div>
      <label class="block font-medium mb-1">State</label>
      <input formControlName="state" type="text" class="w-full border rounded px-3 py-2" />
    </div>

    <!-- Country -->
    <div>
      <label class="block font-medium mb-1">Country</label>
      <input formControlName="country" type="text" class="w-full border rounded px-3 py-2" />
    </div>

    <!-- Zip -->
    <div>
      <label class="block font-medium mb-1">Zip Code</label>
      <input formControlName="zipCode" type="text" class="w-full border rounded px-3 py-2" />
    </div>

    <!-- Buttons -->
    <div class="col-span-2 flex justify-end gap-4 mt-4">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded shadow">
        Register
      </button>
      <button type="reset" class="bg-gray-400 text-white px-4 py-2 rounded shadow">
        Reset
      </button>
    </div>
  </form>
</div>
